project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "blog/**/*.qmd"

website:
  site-url: https://xia071212.github.io/myrepo/
  title: "Yuting Xia"
  navbar:
    logo: images/halloween/golden-autumn-accent.png
    logo-alt: "Golden Retriever with autumn books and a pumpkin"
    left:
      - href: index.qmd
        text: Home
      - bio.qmd
      - resume.qmd
      - blog/index.qmd
  page-footer:
    center: |
      © 2026 Yuting Xia
    left: |
      ![](/images/UniversityofPennsylvania_FullLogo_RGB.png){width=100px}
    right: |
      <span class="seasonal-footer" aria-hidden="true"></span>

format:
  html:
    theme: flatly
    css: [styles.css, autumn-2026-v4.css]
    include-after-body: seasonal-decor.html
    toc: false
    lang: en
    html-math-method: mathml
